name: Build and Publish EPG

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'channels.csv'
      - 'build_custom_epg.py'
      - 'publish_guide.py'
      - '.github/workflows/publish-epg.yml'
      - 'test_build_custom_epg.py'

permissions:
  contents: write

concurrency:
  group: epg-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safe channel matching
        run: python -m unittest discover -p 'test_*.py'
      - name: Build full regional programme guide
        run: python build_custom_epg.py --input channels.csv --outdir generated
      - name: Validate and prepare website
        run: python publish_guide.py --candidate generated/Custom_EPG.xml.gz --destination site
      - name: Publish compressed backup via GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp generated/Custom_EPG.xml.gz generated/guide.xml.gz
          if gh release view epg-current >/dev/null 2>&1; then
            gh release upload epg-current generated/guide.xml.gz --clobber
          else
            gh release create epg-current generated/guide.xml.gz --title "Live EPG XMLTV (auto-updated)" --notes "Generated XMLTV listings. Updated by the scheduled workflow. No IPTV credentials."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
