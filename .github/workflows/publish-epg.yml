name: Build and Publish EPG

on:
  schedule:
    # 06:17 and 18:17 Asia/Riyadh
    - cron: '17 3,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'channels.csv'
      - 'build_custom_epg.py'
      - 'publish_guide.py'
      - '.github/workflows/publish-epg.yml'
      - 'test_build_custom_epg.py'
      - 'test_builder_safety.py'
      - 'test_tvland_feeds.py'
      - 'epg_quality.py'
      - 'test_epg_quality.py'
      - 'test_publish_guide.py'

permissions:
  contents: write

concurrency:
  group: epg-publish
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safe channel matching
        run: python -m unittest discover -p 'test_*.py'
      - name: Build full regional programme guide
        run: python build_custom_epg.py --input channels.csv --outdir generated
      - name: Quarantine contradictory and invalid XMLTV programme records
        run: python epg_quality.py --input generated/Custom_EPG.xml.gz --output generated/Quality_Checked_EPG.xml.gz --report generated/EPG_Quality_Report.json
      - name: Validate checked guide and calculate accurate coverage
        run: python publish_guide.py --candidate generated/Quality_Checked_EPG.xml.gz --destination site
      - name: Publish compressed EPG to stable Release URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp site/guide.xml.gz generated/guide.xml.gz
          if gh release view epg-current >/dev/null 2>&1; then
            gh release upload epg-current generated/guide.xml.gz --clobber
          else
            gh release create epg-current generated/guide.xml.gz --title "Live EPG XMLTV (auto-updated)" --notes "Generated XMLTV listings, refreshed automatically. No IPTV credentials."
          fi
